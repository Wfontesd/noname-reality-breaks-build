name: Deploy validated Shattered Realms build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-shattered-realms.yml

permissions:
  contents: write

concurrency:
  group: deploy-public-shattered-realms
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out public build repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download validated private Web artifact
        run: >-
          curl --fail --location --retry 3
          'https://sdmntprnortheu.oaiusercontent.com/files/00000000-6048-81f4-88de-bf0a751ab299/raw?se=2026-08-14T16%3A44%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=ccc8ee7b-3c2a-54d2-9464-7d49a9ff0380&skoid=e5f84a89-964a-4fd3-92c2-c2cb3a12ea16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T04%3A46%3A18Z&ske=2026-08-15T04%3A46%3A18Z&sks=b&skv=2026-02-06&sig=U1FUqcvg38rZcCn5iCsQDmvvCkgl2EIDLxtKEslt4oY%3D'
          --output /tmp/shattered-realms-web.zip

      - name: Replace repository with build-only output
        shell: bash
        run: |
          shopt -s dotglob nullglob
          for path in * .*; do
            case "$path" in
              .|..|.git) continue ;;
            esac
            rm -rf -- "$path"
          done
          unzip -q /tmp/shattered-realms-web.zip -d .
          sed -i 's|<base href="/">|<base href="/noname-reality-breaks-build/">|' index.html
          grep -q '<base href="/noname-reality-breaks-build/">' index.html
          touch .nojekyll
          printf '%s\n' 'fa00bf310fa6e2a7024481ed25cb6a91f90d2450' > .last_build_id
          printf '%s\n' 'fa00bf310fa6e2a7024481ed25cb6a91f90d2450' > .source_revision
          printf '%s\n' 'shattered-realms-public-test' > .release_channel
          cat > README.md <<'EOF'
          # NoName — Reality Breaks (public test build)

          Build-only repository generated from the private Flutter source.

          This release contains the completed fourth major iteration: the Living Dungeon plus all six Shattered Realms, their realm-specific playfields, shared oath presentation, responsive mobile/desktop HUDs, and Veil Rupture transitions.

          Play: https://wfontesd.github.io/noname-reality-breaks-build/

          Source revision: `fa00bf310fa6e2a7024481ed25cb6a91f90d2450`
          Validated branch revision: `1f84f5131218d89e7b7935fb2d28d43684ca14bc`
          EOF

      - name: Publish build-only commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: publish the Shattered Realms test release'
          git push origin main
